# >>> AUREA-KVIZ · начало блока квиза. Всё между маркерами принадлежит
# только cenasaita.ru и заменяется целиком при обновлении.
# ── КВИЗ · cenasaita.ru · TLS ──────────────────────────────────────────────
# Дописывается в конец deploy/nginx.https.conf ПОСЛЕ выпуска сертификата,
# вместе с блоком :80 выше. Блоки aureadesign.ru не трогаются.
#
# Переходы в один шаг, без цепочек:
#   http://cenasaita.ru      → https://cenasaita.ru   (блок :80)
#   http://www.cenasaita.ru  → https://cenasaita.ru   (блок :80)
#   https://www.cenasaita.ru → https://cenasaita.ru   (блок ниже)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cenasaita.ru;

    ssl_certificate     /etc/letsencrypt/live/cenasaita.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cenasaita.ru/privkey.pem;

    return 301 https://cenasaita.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cenasaita.ru;

    ssl_certificate     /etc/letsencrypt/live/cenasaita.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cenasaita.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Своё имя кеша сессий: общее с основным сайтом имя — это ошибка запуска.
    ssl_session_cache shared:SSLKVIZ:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;

    # Заявка — это несколько сотен байт. Всё, что больше, до приёмника
    # доходить не должно.
    client_max_body_size 32k;

    # ── АДРЕС ПРИЁМНИКА ──
    # У основного сайта имя контейнера резолвится через встроенный DNS Docker,
    # и это правильно: адрес контейнера меняется при каждом пересоздании.
    # У квиза случай другой. Из docker-сети исходящий путь наружу закрыт,
    # поэтому его контейнер живёт в сети ХОСТА и слушает адрес моста —
    # имени в docker-DNS у него больше нет, резолвить нечего. Сам адрес
    # при этом постоянный: он задан подсетью сети и меняется только вместе
    # с самой сетью, то есть при её удалении.
    #
    # 172.18.0.1 — шлюз сети studio_default, он же адрес хоста внутри неё.
    # Если сеть когда-нибудь пересоздадут с другой подсетью, поменять нужно
    # будет и здесь, и в AUREA_KVIZ_BIND у сервиса.

    # Приём заявок. Отдельный location — чтобы таймаут и заголовки были свои.
    location /api/ {
        proxy_pass http://172.18.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # Сам сайт. Кеширующие заголовки ставит приёмник: у файлов с хешем
    # в имени и у шрифтов — год, у HTML — no-cache. Здесь их не переписываем,
    # иначе после выкладки человек увидит старую страницу.
    location / {
        proxy_pass http://172.18.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Сжатые копии лежат в образе рядом с файлами, поэтому заголовок
        # клиента должен дойти до приёмника нетронутым.
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }
}
# <<< AUREA-KVIZ · конец блока квиза
