# ── КВИЗ · cenasaita.ru · только HTTP (до выпуска сертификата) ──────────────
# Дописывается В КОНЕЦ deploy/nginx.https.conf. Блоки aureadesign.ru выше
# не редактируются ни одной строкой.
server {
    listen 80;
    listen [::]:80;
    server_name cenasaita.ru www.cenasaita.ru;

    # Тот же webroot, что у основного сайта: certbot кладёт сюда проверку.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://cenasaita.ru$request_uri;
    }
}
