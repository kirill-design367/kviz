  # ── Квиз-лендинг cenasaita.ru ────────────────────────────────────────────
  # Сайт и приём заявок в одном контейнере: отдаётся статика, /api/lead
  # принимает форму. Наружу не публикуется — только через nginx.
  kviz:
    # Тег приезжает из .env, как и у web: выкладка подставляет туда новый,
    # а прежний остаётся в KVIZ_PREV_IMAGE — по нему делается откат.
    image: ${KVIZ_IMAGE:-ghcr.io/kirill-design367/aurea-kviz:latest}
    container_name: aurea-kviz
    restart: unless-stopped
    # ── СЕТЬ ХОСТА, А НЕ МОСТ ────────────────────────────────────────────
    # Из docker-сети исходящий путь наружу закрыт: TCP до api.telegram.org
    # умирает по таймауту из ЛЮБОГО контейнера этой сети, тогда как с самого
    # хоста тот же адрес отвечает за 44 мс. Причина на стороне хоста
    # (маршрутизация, цепочка FORWARD или подмена адреса), и чинится она
    # правилами, общими для всей сети, — то есть задела бы и основной сайт.
    # Трогать их нельзя, поэтому квиз выведен из моста в сеть хоста:
    # у хоста путь рабочий, по нему заявки и уходят.
    #
    # Что это меняет для соседей: ничего. web, nginx и certbot остаются
    # в своей сети и со своей конфигурацией, их определения не тронуты.
    network_mode: host
    environment:
      # Слушаем ТОЛЬКО адрес моста, а не 0.0.0.0: иначе приёмник висел бы
      # на публичном адресе сервера, в обход nginx и TLS. С этого адреса
      # он виден изнутри docker-сети (то есть для nginx) и с самого хоста —
      # и ниоткуда больше.
      - AUREA_KVIZ_BIND=${KVIZ_BIND:-172.18.0.1}
      - AUREA_KVIZ_PORT=8787
      # Тот же бот и тот же чат, что и у заявок основного сайта.
      # Новых ключей не заводим, значения берутся из .env как есть.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Заголовкам X-Real-IP и X-Forwarded-For верим только от nginx.
      # Адрес соседнего контейнера меняется при пересоздании, поэтому
      # доверие задаётся подсетью сети compose, а не точным адресом.
      # Иначе весь трафик выглядел бы приходящим с одного адреса,
      # и лимит в восемь заявок в час стал бы общим на всех сразу.
      - AUREA_KVIZ_TRUSTED_PROXIES=172.18.0.0/16
    # dns здесь не задаётся намеренно: в сети хоста Docker эту настройку
    # не принимает, а имена и так разрешаются резолвером хоста — тем самым,
    # у которого путь до Telegram рабочий.
    volumes:
      # Заявки на диске: они пишутся ДО ответа браузеру и переживают
      # передеплой. Свой том, к aurea-data основного сайта не примешиваемся.
      - kviz-data:/var/lib/aurea-kviz
