# Квиз-лендинг cenasaita.ru — фрагмент для docker-compose.yml основного стека.
#
# Вставляется В КОНЕЦ раздела services (перед строкой «volumes:»), а том
# kviz-data — в конец раздела volumes. Сервисы web, nginx и certbot
# не затрагиваются ни одной строкой.

  kviz:
    # Тег приезжает из .env, как и у web: выкладка подставляет туда новый,
    # а прежний остаётся в KVIZ_PREV_IMAGE — по нему делается откат.
    image: ${KVIZ_IMAGE:-ghcr.io/kirill-design367/aurea-kviz:latest}
    container_name: aurea-kviz
    restart: unless-stopped
    environment:
      # Тот же бот и тот же чат, что и у заявок основного сайта.
      # Новых ключей не заводим, значения берутся из .env как есть.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Заголовкам X-Real-IP и X-Forwarded-For верим только от nginx.
      # Адрес соседнего контейнера меняется при пересоздании, поэтому
      # доверие задаётся подсетью сети compose, а не точным адресом.
      # Иначе весь трафик выглядел бы приходящим с одного адреса,
      # и лимит в восемь заявок в час стал бы общим на всех сразу.
      - AUREA_KVIZ_TRUSTED_PROXIES=172.18.0.0/16
    # ── ИМЕНА РАЗРЕШАЕМ ЧЕРЕЗ ВНЕШНИЙ DNS, А НЕ ЧЕРЕЗ РЕЗОЛВЕР ХОСТА ──
    # Ровно по той же причине, что у web и certbot: связка «встроенный DNS →
    # резолвер хоста» рвётся после деплоя, и api.telegram.org уходит
    # в таймаут. Здесь заявка ещё и не потеряется — она сначала ложится
    # на диск, — но уведомление молчало бы до ручного перезапуска Docker.
    dns:
      - 77.88.8.8
      - 77.88.8.1
    expose:
      - "8787"                            # наружу не публикуем — только через nginx
    volumes:
      # Заявки на диске: они пишутся ДО ответа браузеру и переживают
      # передеплой. Свой том, к aurea-data основного сайта не примешиваемся.
      - kviz-data:/var/lib/aurea-kviz
