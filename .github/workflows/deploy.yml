name: Сборка и публикация на GitHub Pages

on:
  push:
    branches:
      - main
      - claude/aurea-quiz-landing-1i0c4o
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты расчёта вилки
        run: npm test

      - name: Сборка статики
        env:
          # Репозиторий публикуется по адресу /kviz — отсюда basePath.
          NEXT_PUBLIC_BASE_PATH: /kviz
          NEXT_PUBLIC_SITE_URL: https://kirill-design367.github.io/kviz
          # Адрес приёмника заявок. Переопределяется переменной репозитория
          # LEAD_ENDPOINT в Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT || 'https://kviz.aureadesign.ru/api/lead' }}
          # Номер счётчика Метрики. Пока переменной нет — счётчик не грузится.
          NEXT_PUBLIC_YM_ID: ${{ vars.YM_ID }}
        run: npm run build

      - name: Отключить обработку Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    # Блок environment: github-pages здесь намеренно не указан. Это окружение
    # создаётся с ограничением по имени ветки, и джоб падал за две секунды,
    # не начав ни одного шага. Само развёртывание создаёт actions/deploy-pages,
    # окружение ему для этого не требуется.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Адрес опубликованного сайта
        run: echo "Сайт опубликован — ${{ steps.deployment.outputs.page_url }}"
