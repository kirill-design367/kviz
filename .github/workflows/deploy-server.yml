name: Квиз — образ в GHCR и выкладка на сервер

# Схема повторяет ту, по которой ездит основной сайт: образ собирается здесь,
# лежит в GHCR, сервер только забирает готовое. Базовые образы тянутся на этой
# стороне — на сервере docker.io недоступен.

on:
  push:
    branches:
      - main
      - claude/aurea-quiz-landing-1i0c4o
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kviz-server
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aurea-kviz

jobs:
  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Тесты гоняются ДО сборки образа: незачем публиковать заведомо битое.
      - name: Тесты расчёта вилки
        run: npm test

      - name: Проверка типов
        run: npm run typecheck

      - id: meta
        name: Тег образа
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкладка
    needs: build
    runs-on: ubuntu-latest
    # Пока ключа нет, джоб не запускается и сборка остаётся зелёной.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Ключ и известный хост
        id: ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Секрета DEPLOY_SSH_KEY нет — выкладка пропущена, образ опубликован."
            echo "ready=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Ключ хоста может лежать в секрете в двух видах: полной строкой
          # known_hosts («хост тип ключ») или одним ключом («ssh-ed25519 AAAA…»),
          # как его показывает ssh-keyscan без первого поля. Во втором случае
          # имя хоста надо дописать самим: без него ssh не находит запись
          # и падает с «Host key verification failed» — ровно это и случилось
          # со всеми прошлыми выкладками, поэтому образ собирался, а на сервер
          # не уезжал.
          : > ~/.ssh/known_hosts
          printf '%s\n' "$HOST_KEY" | while IFS= read -r ln; do
            [ -n "$ln" ] || continue
            case "$ln" in
              ssh-*|ecdsa-*|sk-*) printf '%s %s\n' "$HOST" "$ln" ;;
              *) printf '%s\n' "$ln" ;;
            esac
          done >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          lines=$(grep -c . ~/.ssh/known_hosts || true)
          fields=$(awk 'NF>=3{n++} END{print n+0}' ~/.ssh/known_hosts)
          echo "known_hosts: строк $lines, из них пригодных $fields"
          if [ "$fields" = "0" ]; then
            echo "В секрете DEPLOY_HOST_KEY нет ни одной пригодной строки."
            echo "Нужна строка вида «ssh-ed25519 AAAA…» или «хост ssh-ed25519 AAAA…»,"
            echo "как её печатает ssh-keyscan -t ed25519 <адрес сервера>."
            echo "ready=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: Выкладка на сервер
        if: steps.ssh.outputs.ready == 'yes'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$USER@$HOST" \
            "IMAGE='$IMAGE' TAG='$TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aurea/studio

          # Сервиса ещё нет в compose — значит стек к квизу не готов.
          # Молча выходим: образ опубликован, поставим руками.
          if ! docker compose config --services | grep -qx kviz; then
            echo "Сервис kviz в docker-compose.yml не найден — выкладка пропущена."
            exit 0
          fi

          NEW="$IMAGE:$TAG"

          # Значение из .env читаем с обрезкой: пробел в конце строки не виден
          # глазом, но делает значение мусором. У NGINX_CONF такой пробел уже
          # был и уронил другой скрипт — здесь он сломал бы откат.
          env_value() {
            sed -n "s/^[[:space:]]*$1[[:space:]]*=//p" .env 2>/dev/null \
              | head -1 | tr -d '\r' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }
          OLD=$(env_value KVIZ_IMAGE)
          echo "Было: ${OLD:-нет}"
          echo "Станет: $NEW"

          # Тег подставляется через .env — тем же способом, что у основного
          # сайта (IMAGE / PREV_IMAGE). Прежний остаётся для отката.
          set_key() {
            local key="$1" val="$2"
            if grep -q "^[[:space:]]*$key[[:space:]]*=" .env; then
              # Правка на месте, без sed -i: .env читается compose'ом,
              # и менять инод файла незачем.
              local tmp; tmp=$(mktemp)
              grep -v "^[[:space:]]*$key[[:space:]]*=" .env > "$tmp"
              printf '%s=%s\n' "$key" "$val" >> "$tmp"
              cat "$tmp" > .env
              rm -f "$tmp"
            else
              printf '%s=%s\n' "$key" "$val" >> .env
            fi
          }

          # Не «[ -n ... ] && set_key»: при пустом OLD такая связка возвращает
          # единицу, и set -e уронил бы первую же выкладку.
          if [ -n "${OLD:-}" ]; then
            set_key KVIZ_PREV_IMAGE "$OLD"
          fi
          set_key KVIZ_IMAGE "$NEW"

          docker compose pull kviz
          # Явное имя сервиса: web, nginx и certbot не пересоздаются.
          docker compose up -d kviz

          # Ждём, пока контейнер станет здоровым. Здоров — значит принимает
          # заявки и не потеряет их: на диск они ложатся до ответа браузеру.
          ok=no
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' aurea-kviz 2>/dev/null || echo unknown)
            [ "$state" = healthy ] && { ok=yes; break; }
            [ "$state" = unhealthy ] && break
            sleep 2
          done

          if [ "$ok" != yes ]; then
            echo "Новый образ не поднялся. Откат."
            docker logs --tail 40 aurea-kviz 2>&1 || true
            if [ -n "${OLD:-}" ]; then
              set_key KVIZ_IMAGE "$OLD"
              docker compose up -d kviz
              echo "Вернул $OLD"
            fi
            exit 1
          fi

          docker compose ps kviz
          # Старые образы намеренно не подчищаем: prune на чужом сервере
          # может задеть не только наше. Места на диске 39 ГБ.
          echo "Выложено: $NEW"
          REMOTE
